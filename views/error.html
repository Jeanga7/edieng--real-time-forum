<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="assets/img/bg/forum.ico.png">
    <title>{{.errorName}} - 4UM</title>

    <link rel="stylesheet" href="assets/css/style.css">

<body>
